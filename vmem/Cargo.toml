[package]
name = "vmem"
version = "0.1.0"
edition = "2021"
description = "Voice memory toolkit: keeps a public repo readable as memory for stateless voice agents"
publish = false

[[bin]]
name = "vmem"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[profile.release]
strip = true
